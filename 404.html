<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada · Stardew Journal</title>
    <meta name="description" content="La página que buscás no existe en Stardew Journal.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 7rem 1.5rem;
            background: linear-gradient(rgba(244, 237, 220, .88), rgba(244, 237, 220, .94)), url("assets/images/backgrounds/stardew-background.jpg") center/cover
        }

        .error-box {
            width: min(100%, 720px);
            padding: 2.2rem;
            text-align: center;
            background: rgba(255, 250, 240, .92);
            border: 1px solid var(--line);
            box-shadow: var(--shadow)
        }

        .error-code {
            font: 5.5rem/1 "Jersey 15", sans-serif;
            color: var(--green);
            text-shadow: 3px 3px 0 rgba(215, 171, 84, .26)
        }

        .error-box h1 {
            margin-top: .2rem;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            color: var(--brown-deep)
        }

        .error-box p {
            max-width: 560px;
            margin: 1rem auto 0
        }

        .error-box .button {
            margin-top: 1.35rem;
            background: var(--green);
            padding: .75rem 1rem;
            border: 1px solid var(--green)
        }
    </style>
</head>

<body>
    <main class="error-page">
        <section class="error-box" aria-labelledby="error-title">
            <div class="error-code" aria-hidden="true">404</div>
            <h1 id="error-title">Ese sendero no aparece en el mapa.</h1>
            <p>La página que buscaste no existe, fue movida o todavía no forma parte del journal.</p><a class="button"
                href="index.html">Volver al inicio →</a>
        </section>
    </main>
</body>

</html>
